name: Verify Discovery Tool Install

on:
  push:
    paths:
      - .github/actions/install-discovery-tool/**
      - .github/workflows/publish-discovery-tool.yml
  workflow_dispatch:
    inputs:
      tool_version:
        description: Optional explicit discovery tool version tag to install from GHCR
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-discovery-tool-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install discovery tool from GHCR
        id: install_tool
        uses: ./.github/actions/install-discovery-tool
        with:
          github-token: ${{ github.token }}
          github-actor: ${{ github.actor }}
          github-owner: ${{ github.repository_owner }}
          tool-version: ${{ inputs.tool_version }}

      - name: Verify installed tool
        shell: pwsh
        run: |
          inspectra-discovery --version
          Write-Host "Installed version: ${{ steps.install_tool.outputs.tool_version }}"
